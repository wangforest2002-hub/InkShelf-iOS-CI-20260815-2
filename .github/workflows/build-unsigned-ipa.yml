name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "InkShelf/**"
      - "InkShelfTests/**"
      - "InkShelfUITests/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project InkShelf.xcodeproj \
            -scheme InkShelf

      - name: Select an available iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build the simulator test bundle
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO

      - name: Run model and reading-restoration tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -skip-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            -skip-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            -skip-testing:InkShelfUITests \
            -parallel-testing-enabled NO

      - name: Run security-scoped copy smoke test
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            -parallel-testing-enabled NO

      - name: Run CBZ, PDF, and folder import smoke test
        timeout-minutes: 4
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            -parallel-testing-enabled NO

      - name: Run shelf-to-reader UI navigation smoke test
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -resultBundlePath ui-tests.xcresult \
            -only-testing:InkShelfUITests/ReaderNavigationUITests \
            -parallel-testing-enabled NO

      - name: Upload UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-ui-test-results
          path: ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Launch app and capture UI smoke screenshot
        run: |
          APP_PATH="build-simulator/Build/Products/Debug-iphonesimulator/InkShelf.app"
          test -d "$APP_PATH"
          xcrun simctl terminate "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl uninstall "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.inkshelf.reader | grep -q 'com.inkshelf.reader:'
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot ui-smoke.png
          test -s ui-smoke.png

      - name: Upload UI smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-ui-smoke
          path: ui-smoke.png
          if-no-files-found: error
          retention-days: 30

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app identity and icon assets
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "二次元小家"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.7.1"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null
          find "$APP_PATH" -maxdepth 1 -type f \( -name 'AppIcon*.png' -o -name 'Assets.car' \) | grep -q .

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          test -d "$APP_PATH"
          rm -rf Payload InkShelf-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload InkShelf-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-unsigned-ipa
          path: InkShelf-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
