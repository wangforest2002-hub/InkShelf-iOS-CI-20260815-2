name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "InkShelf/**"
      - "InkShelfTests/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project InkShelf.xcodeproj \
            -scheme InkShelf

      - name: Select an available iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build the simulator test bundle
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Run model and reading-restoration tests
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -skip-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            -skip-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            CODE_SIGNING_ALLOWED=NO

      - name: Run security-scoped copy smoke test
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            CODE_SIGNING_ALLOWED=NO

      - name: Run CBZ, PDF, and folder import smoke test
        timeout-minutes: 4
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          test -d "$APP_PATH"
          rm -rf Payload InkShelf-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload InkShelf-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-unsigned-ipa
          path: InkShelf-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
