name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      quick_release:
        description: Build the release IPA without running simulator tests
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "InkShelf/**"
      - "InkShelfTests/**"
      - "InkShelfUITests/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 48
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_MOBILEPROVISION_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project InkShelf.xcodeproj \
            -scheme InkShelf

      - name: Select available iPhone and iPad Simulators
        if: ${{ inputs.quick_release != true }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          IPAD_DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPad")))')
          test -n "$DEVICE_ID"
          test -n "$IPAD_DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          # Compilation does not require SpringBoard to be ready. The first
          # xcodebuild test command will wait for the destination if needed.
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "IPAD_DEVICE_ID=$IPAD_DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build the simulator test bundle
        if: ${{ inputs.quick_release != true }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -parallel-testing-enabled NO

      - name: Run model and reading-restoration tests
        if: ${{ inputs.quick_release != true }}
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -skip-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            -skip-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            -skip-testing:InkShelfUITests \
            -parallel-testing-enabled NO

      - name: Run security-scoped copy smoke test
        if: ${{ inputs.quick_release != true }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testCoordinatedCopyPreservesOriginalBytes \
            -parallel-testing-enabled NO

      - name: Run CBZ, PDF, and folder import smoke test
        if: ${{ inputs.quick_release != true }}
        timeout-minutes: 4
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -only-testing:InkShelfTests/BookModelTests/testLocalCBZPDFFolderSmokeImport \
            -parallel-testing-enabled NO

      - name: Restart simulator before UI tests
        if: ${{ inputs.quick_release != true }}
        run: |
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run shelf-to-reader and app-navigation UI smoke test
        if: ${{ inputs.quick_release != true }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -resultBundlePath ui-tests.xcresult \
            -only-testing:InkShelfUITests/ReaderNavigationUITests/testSeededLocalBookOpensAndReturnsFromReader \
            -parallel-testing-enabled NO

      - name: Run system document-picker UI smoke test
        if: ${{ inputs.quick_release != true }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            -resultBundlePath ui-tests-picker.xcresult \
            -only-testing:InkShelfUITests/ReaderNavigationUITests/testSystemDocumentPickerImportsThenOpensImage \
            -parallel-testing-enabled NO

      - name: Freeze UI test diagnostics
        if: ${{ always() && inputs.quick_release != true }}
        run: |
          for BUNDLE in \
            ui-tests.xcresult \
            ui-tests-picker.xcresult; do
            if [ -d "$BUNDLE" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" "$BUNDLE.zip"
            fi
          done

      - name: Upload UI test diagnostics
        if: ${{ always() && inputs.quick_release != true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-ui-test-results
          path: |
            ui-tests.xcresult.zip
            ui-tests-picker.xcresult.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - name: Launch app and capture formal welcome and UI smoke screenshots
        if: ${{ inputs.quick_release != true }}
        run: |
          APP_PATH="build-simulator/Build/Products/Debug-iphonesimulator/InkShelf.app"
          test -d "$APP_PATH"
          xcrun simctl shutdown "$IPAD_DEVICE_ID" 2>/dev/null || true
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl terminate "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl uninstall "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.inkshelf.reader --args INKSHELF_UI_TEST_WELCOME | grep -q 'com.inkshelf.reader:'
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot welcome-2-5.png
          test -s welcome-2-5.png
          xcrun simctl terminate "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl uninstall "$DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.inkshelf.reader --args INKSHELF_UI_TEST_NIGHT | grep -q 'com.inkshelf.reader:'
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot ui-smoke.png
          test -s ui-smoke.png
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl boot "$IPAD_DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
          xcrun simctl uninstall "$IPAD_DEVICE_ID" com.inkshelf.reader 2>/dev/null || true
          xcrun simctl install "$IPAD_DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$IPAD_DEVICE_ID" com.inkshelf.reader --args INKSHELF_UI_TEST_WELCOME | grep -q 'com.inkshelf.reader:'
          sleep 4
          xcrun simctl io "$IPAD_DEVICE_ID" screenshot welcome-2-5-ipad.png
          test -s welcome-2-5-ipad.png

      - name: Upload UI smoke screenshot
        if: ${{ inputs.quick_release != true }}
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-ui-smoke
          path: |
            welcome-2-5.png
            welcome-2-5-ipad.png
            ui-smoke.png
          if-no-files-found: error
          retention-days: 30

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project InkShelf.xcodeproj \
            -scheme InkShelf \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app identity and icon assets
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "二次元小家"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "2.5.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "29"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null
          find "$APP_PATH" -maxdepth 1 -type f \( -name 'AppIcon*.png' -o -name 'Assets.car' \) | grep -q .
          test -d "$APP_PATH/RealESRGANAnimeSharp.mlmodelc"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          test -d "$APP_PATH"
          rm -rf Payload InkShelf-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload InkShelf-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-unsigned-ipa
          path: InkShelf-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Import private iOS signing identity
        if: env.IOS_SIGNING_ENABLED == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_P12_BASE64"
          test -n "$IOS_MOBILEPROVISION_BASE64"
          SIGNING_ROOT="$RUNNER_TEMP/inkshelf-signing"
          mkdir -p "$SIGNING_ROOT"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$SIGNING_ROOT/signing.p12"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$SIGNING_ROOT/profile.mobileprovision"
          KEYCHAIN_PATH="$SIGNING_ROOT/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_ROOT/signing.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "SIGNING_ROOT=$SIGNING_ROOT" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign and verify the device IPA
        if: env.IOS_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/InkShelf.app"
          PROFILE="$SIGNING_ROOT/profile.mobileprovision"
          PROFILE_PLIST="$SIGNING_ROOT/profile.plist"
          ENTITLEMENTS="$SIGNING_ROOT/entitlements.plist"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          test "${PROFILE_APP_ID#*.}" = "com.inkshelf.reader"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS"
          cp "$PROFILE" "$APP_PATH/embedded.mobileprovision"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/[0-9A-F]{40}/ {print $2; exit}')
          test -n "$IDENTITY"
          while IFS= read -r -d '' NESTED; do
            codesign --force --sign "$IDENTITY" --timestamp=none "$NESTED"
          done < <(find "$APP_PATH" -depth \( -name '*.framework' -o -name '*.appex' -o -name '*.dylib' \) -print0)
          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          SIGNED_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          SIGNED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          test "$SIGNED_BUNDLE_ID" = "com.inkshelf.reader"
          test "$SIGNED_VERSION" = "2.5.1"
          test "$SIGNED_BUILD" = "29"
          mkdir -p SignedPackage/Payload
          cp -R "$APP_PATH" SignedPackage/Payload/
          (cd SignedPackage && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/InkShelf-signed.ipa")

      - name: Upload signed IPA
        if: env.IOS_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-signed-ipa
          path: InkShelf-signed.ipa
          if-no-files-found: error
          retention-days: 14
