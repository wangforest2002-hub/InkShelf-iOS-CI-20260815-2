# Standalone InkShelf release channel. Publishing is SSH-only; downloads are public.
location = /inkshelf-update {
    return 302 /inkshelf-update/;
}

location = /inkshelf-update/latest.json {
    alias /srv/inkshelf-update/public/latest.json;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /inkshelf-update/ {
    alias /srv/inkshelf-update/public/;
    index index.html;
    autoindex off;
    types {
        text/html html;
        application/json json;
        application/octet-stream ipa;
        text/xml plist;
    }
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
