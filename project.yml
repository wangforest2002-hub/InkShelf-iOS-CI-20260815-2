name: InkShelf

options:
  bundleIdPrefix: com.inkshelf
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  InkShelf:
    type: application
    platform: iOS
    sources:
      - path: InkShelf
        excludes:
          - Resources
    resources:
      - path: InkShelf/Resources/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    info:
      path: InkShelf/Resources/Info.plist
      properties:
        CFBundleDisplayName: 墨阅
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF 文档
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: 漫画压缩包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.inkshelf.cbz
              - public.zip-archive
          - CFBundleTypeName: 图片
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.inkshelf.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkshelf.reader
        PRODUCT_NAME: InkShelf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      Release:
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: -O
    scheme:
      testTargets:
        - InkShelfTests
      gatherCoverageData: true

  InkShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InkShelfTests
    dependencies:
      - target: InkShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkshelf.reader.tests
        GENERATE_INFOPLIST_FILE: true
